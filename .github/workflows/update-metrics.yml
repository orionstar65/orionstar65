name: Update profile metrics

on:
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build accurate public profile metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_metrics.py
      - name: Commit only changed generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/metrics-dark.svg assets/generated/metrics-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh public metrics"
            git push
          fi
